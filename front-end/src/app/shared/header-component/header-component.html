<header
  class="app-header"
  [class.app-header--gestao]="areaAtual === 'gestao'"
>
  <div class="container-fluid pt-4">
    <section class="header-shell shadow-sm" aria-labelledby="tituloPagina">
      <span class="header-decoration header-decoration--one" aria-hidden="true"></span>
      <span class="header-decoration header-decoration--two" aria-hidden="true"></span>

      <div class="header-content">
        <div class="header-title-group">
          <span class="header-page-icon" aria-hidden="true">
            <i class="bi" [ngClass]="icone"></i>
          </span>

          <div class="header-copy">
            <span class="header-kicker">
              <span class="header-kicker-dot" aria-hidden="true"></span>
              {{ subtitulo }}
            </span>

            <h1 id="tituloPagina" class="header-title">
              {{ titulo }}
            </h1>

            <p class="header-description">
              {{ descricao }}
            </p>
          </div>
        </div>

        <div class="header-date-card" aria-label="Data atual">
          <span class="header-date-icon" aria-hidden="true">
            <i class="bi bi-calendar2-week"></i>
          </span>

          <div class="header-date-copy">
            <span class="header-date-label">Hoje</span>
            <strong class="header-date-value">{{ dataHoje }}</strong>
            <small class="header-weekday">{{ diaSemana }}</small>
          </div>
        </div>
      </div>
    </section>
  </div>
</header>
