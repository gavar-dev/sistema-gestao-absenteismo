<button type="button" class="btn sidebar-menu-btn d-lg-none position-fixed z-3" data-bs-toggle="offcanvas"
  data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menu">
  <span class="sidebar-menu-btn-icon" aria-hidden="true">
    <i class="bi bi-list"></i>
  </span>
  <span class="sidebar-menu-btn-label">Menu</span>
</button>

<aside id="menuLateral" class="offcanvas-lg offcanvas-start sidebar-bootstrap" tabindex="-1"
  aria-labelledby="menuLateralTitulo">
  <span class="sidebar-decoration sidebar-decoration--one" aria-hidden="true"></span>
  <span class="sidebar-decoration sidebar-decoration--two" aria-hidden="true"></span>

  <div class="offcanvas-header sidebar-header">
    <div class="sidebar-brand">
      <span class="sidebar-logo" aria-hidden="true">
        <i class="bi bi-building-check"></i>
      </span>

      <div class="sidebar-brand-copy">
        <h1 id="menuLateralTitulo" class="sidebar-brand-title">NexusRH</h1>
        <small class="sidebar-brand-subtitle">Portal do funcionário</small>
      </div>
    </div>

    <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
      data-bs-target="#menuLateral" aria-label="Fechar menu"></button>
  </div>

  <div class="offcanvas-body sidebar-body">
    <section class="sidebar-user-card" aria-label="Usuário conectado">
      <div class="sidebar-avatar-wrap">
        <app-funcionario-avatar [funcionarioId]="usuario.id" [nomeCompleto]="usuario.nome"
          [tamanho]="58"></app-funcionario-avatar>
        <span class="sidebar-status-dot" title="Usuário conectado" aria-label="Usuário conectado"></span>
      </div>

      <div class="sidebar-user-copy">
        <span class="sidebar-user-label">Bem-vinda</span>
        <strong class="sidebar-user-name" title="{{ usuario.nome }}">{{ usuario.nome }}</strong>
        <small class="sidebar-user-role" title="{{ usuario.cargo }} • {{ usuario.setor }}">
          {{ usuario.cargo }} • {{ usuario.setor }}
        </small>
      </div>
    </section>

    <div class="sidebar-nav-section">
      <div class="sidebar-section-heading">
        <span>Navegação</span>
        <i class="bi bi-grid" aria-hidden="true"></i>
      </div>

      <nav class="nav nav-pills flex-column sidebar-nav" aria-label="Menu principal">
        <a *ngFor="let item of menu" class="nav-link sidebar-link" [routerLink]="item.rota" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exata }" ariaCurrentWhenActive="page" data-bs-dismiss="offcanvas"
          data-bs-target="#menuLateral">
          <span class="sidebar-link-icon" aria-hidden="true">
            <i class="bi" [ngClass]="item.icone"></i>
          </span>
          <span class="sidebar-link-label">{{ item.nome }}</span>
          <i class="bi bi-chevron-right sidebar-link-arrow" aria-hidden="true"></i>
        </a>
      </nav>
    </div>

    <div class="sidebar-footer-area">
      <section class="sidebar-info-card" aria-label="Jornada padrão">
        <span class="sidebar-info-icon" aria-hidden="true">
          <i class="bi bi-clock"></i>
        </span>
        <div>
          <small>Jornada padrão</small>
          <strong>08:00 às 17:00</strong>
        </div>
      </section>

      <div class="sidebar-actions">
        <button type="button" class="btn app-theme-toggle app-theme-toggle--sidebar sidebar-action-btn"
          (click)="alternarTema()"
          [attr.aria-label]="temaAtual === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'">
          <span class="sidebar-action-icon" aria-hidden="true">
            <i class="bi" [ngClass]="temaAtual === 'dark' ? 'bi-sun' : 'bi-moon-stars'"></i>
          </span>
          <span>{{ temaAtual === 'dark' ? 'Tema claro' : 'Tema escuro' }}</span>
        </button>

        <button type="button" class="btn sidebar-logout-btn sidebar-action-btn" (click)="sair()">
          <span class="sidebar-action-icon" aria-hidden="true">
            <i class="bi bi-box-arrow-right"></i>
          </span>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
</aside>
