<button
  type="button"
  class="btn admin-sidebar-menu-btn d-lg-none position-fixed z-3"
  data-bs-toggle="offcanvas"
  data-bs-target="#menuGestaoLateral"
  aria-controls="menuGestaoLateral"
  aria-label="Abrir menu de gestão"
>
  <span class="admin-sidebar-menu-btn-icon" aria-hidden="true">
    <i class="bi bi-list"></i>
  </span>
  <span class="admin-sidebar-menu-btn-label">Menu</span>
</button>

<aside
  id="menuGestaoLateral"
  class="offcanvas-lg offcanvas-start admin-sidebar-bootstrap"
  tabindex="-1"
  aria-labelledby="menuGestaoLateralTitulo"
>
  <span class="admin-sidebar-decoration admin-sidebar-decoration--one" aria-hidden="true"></span>
  <span class="admin-sidebar-decoration admin-sidebar-decoration--two" aria-hidden="true"></span>

  <div class="offcanvas-header admin-sidebar-header">
    <div class="admin-sidebar-brand">
      <span class="admin-sidebar-logo" aria-hidden="true">
        <i class="bi bi-shield-check"></i>
      </span>

      <div class="admin-sidebar-brand-copy">
        <h1 id="menuGestaoLateralTitulo" class="admin-sidebar-brand-title">NexusRH</h1>
        <small class="admin-sidebar-brand-subtitle">Painel Gestão/RH</small>
      </div>
    </div>

    <button
      type="button"
      class="btn-close btn-close-white d-lg-none"
      data-bs-dismiss="offcanvas"
      data-bs-target="#menuGestaoLateral"
      aria-label="Fechar menu"
    ></button>
  </div>

  <div class="offcanvas-body admin-sidebar-body">
    <section class="admin-sidebar-user-card" aria-label="Usuário conectado">
      <div class="admin-sidebar-avatar-wrap">
        <app-funcionario-avatar
          [funcionarioId]="usuario.id"
          [nomeCompleto]="usuario.nome"
          [tamanho]="48"
        ></app-funcionario-avatar>
        <span class="admin-sidebar-status-dot" title="Usuário conectado" aria-label="Usuário conectado"></span>
      </div>

      <div class="admin-sidebar-user-copy">
        <span class="admin-sidebar-user-label">Acesso administrativo</span>
        <strong class="admin-sidebar-user-name" title="{{ usuario.nome }}">{{ usuario.nome }}</strong>
        <small class="admin-sidebar-user-role" title="{{ usuario.cargo }} • {{ usuario.setor }}">
          {{ usuario.cargo }} • {{ usuario.setor }}
        </small>
      </div>
    </section>

    <div class="admin-sidebar-nav-section">
      <div class="admin-sidebar-section-heading">
        <span>Gestão e RH</span>
        <i class="bi bi-grid" aria-hidden="true"></i>
      </div>

      <nav class="nav nav-pills flex-column admin-sidebar-nav" aria-label="Menu de gestão e RH">
        <a
          *ngFor="let item of menu"
          class="nav-link admin-sidebar-link"
          [routerLink]="item.rota"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exata }"
          ariaCurrentWhenActive="page"
          data-bs-dismiss="offcanvas"
          data-bs-target="#menuGestaoLateral"
        >
          <span class="admin-sidebar-link-icon" aria-hidden="true">
            <i class="bi" [ngClass]="item.icone"></i>
          </span>
          <span class="admin-sidebar-link-label">{{ item.nome }}</span>
          <i class="bi bi-chevron-right admin-sidebar-link-arrow" aria-hidden="true"></i>
        </a>
      </nav>
    </div>

    <div class="admin-sidebar-footer-area">
      <section class="admin-sidebar-info-card" aria-label="Visão administrativa">
        <span class="admin-sidebar-info-icon" aria-hidden="true">
          <i class="bi bi-graph-up-arrow"></i>
        </span>
        <div>
          <small>Visão administrativa</small>
          <strong>Jornada e absenteísmo</strong>
        </div>
      </section>

      <div class="admin-sidebar-actions">
        <button
          type="button"
          class="btn app-theme-toggle app-theme-toggle--sidebar admin-sidebar-action-btn"
          (click)="alternarTema()"
          [attr.aria-label]="temaAtual === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
        >
          <span class="admin-sidebar-action-icon" aria-hidden="true">
            <i class="bi" [ngClass]="temaAtual === 'dark' ? 'bi-sun' : 'bi-moon-stars'"></i>
          </span>
          <span>{{ temaAtual === 'dark' ? 'Tema claro' : 'Tema escuro' }}</span>
        </button>

        <button type="button" class="btn admin-sidebar-logout-btn admin-sidebar-action-btn" (click)="sair()">
          <span class="admin-sidebar-action-icon" aria-hidden="true">
            <i class="bi bi-box-arrow-right"></i>
          </span>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
</aside>
