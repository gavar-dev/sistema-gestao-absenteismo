<span
  class="funcionario-avatar"
  [style.width.px]="tamanho"
  [style.height.px]="tamanho"
  [attr.aria-label]="
    fotoUrl
      ? 'Foto de ' + nomeCompleto
      : 'Iniciais de ' + nomeCompleto
  "
>
  <img
    *ngIf="fotoUrl; else fallback"
    class="funcionario-avatar-imagem"
    [src]="fotoUrl"
    [alt]="'Foto de ' + nomeCompleto"
  />

  <ng-template #fallback>
    <span
      class="funcionario-avatar-iniciais"
      [style.font-size.px]="
        tamanho * 0.34
      "
      aria-hidden="true"
    >
      {{ iniciais }}
    </span>
  </ng-template>

  <span
    *ngIf="carregandoFoto"
    class="funcionario-avatar-loading"
    aria-hidden="true"
  ></span>
</span>
