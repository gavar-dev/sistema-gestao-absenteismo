<button
  type="button"
  class="btn admin-sidebar-menu-btn d-lg-none position-fixed top-0 start-0 m-3 z-3"
  data-bs-toggle="offcanvas"
  data-bs-target="#menuGestaoLateral"
  aria-controls="menuGestaoLateral"
  aria-label="Abrir menu de gestão"
>
  <i class="bi bi-list fs-4"></i>
</button>

<aside
  id="menuGestaoLateral"
  class="offcanvas-lg offcanvas-start text-bg-dark admin-sidebar-bootstrap"
  tabindex="-1"
  aria-labelledby="menuGestaoLateralTitulo"
>
  <div class="offcanvas-header border-bottom border-light border-opacity-10">
    <div class="d-flex align-items-center gap-3">
      <div class="admin-sidebar-logo d-inline-flex align-items-center justify-content-center rounded-3 p-2 fs-4">
        <i class="bi bi-shield-check"></i>
      </div>

      <div>
        <h1 id="menuGestaoLateralTitulo" class="h5 fw-bold mb-0">NexusRH</h1>
        <small class="text-white-50 text-uppercase fw-semibold">Painel Gestão/RH</small>
      </div>
    </div>

    <button
      type="button"
      class="btn-close btn-close-white d-lg-none"
      data-bs-dismiss="offcanvas"
      data-bs-target="#menuGestaoLateral"
      aria-label="Fechar menu"
    ></button>
  </div>

  <div class="offcanvas-body d-flex flex-column p-3">
    <div class="card admin-sidebar-user-card mb-4">
      <div class="card-body d-flex align-items-center gap-3 p-3">
        <div class="admin-sidebar-avatar rounded-circle fw-bold d-inline-flex align-items-center justify-content-center">
          {{ usuario.iniciais }}
        </div>

        <div class="text-truncate">
          <strong class="d-block text-truncate">{{ usuario.nome }}</strong>
          <small class="d-block text-white-75 text-truncate">{{ usuario.cargo }}</small>
          <small class="d-block text-white-50 text-truncate">{{ usuario.setor }}</small>
        </div>
      </div>
    </div>

    <nav class="nav nav-pills flex-column gap-2" aria-label="Menu de gestão e RH">
      <a
        *ngFor="let item of menu"
        class="nav-link admin-sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 fw-semibold"
        [routerLink]="item.rota"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exata }"
        data-bs-dismiss="offcanvas"
        data-bs-target="#menuGestaoLateral"
      >
        <i class="bi fs-5" [ngClass]="item.icone"></i>
        <span>{{ item.nome }}</span>
      </a>
    </nav>

    <div class="mt-auto pt-4">
      <div class="card admin-sidebar-info-card mb-3">
        <div class="card-body p-3">
          <small class="d-block text-white-50">Visão administrativa</small>
          <strong class="d-block">Gestão de jornada e absenteísmo</strong>
        </div>
      </div>

      <button
        type="button"
        class="btn app-theme-toggle app-theme-toggle--sidebar w-100 mb-2"
        (click)="alternarTema()"
        [attr.aria-label]="temaAtual === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
      >
        <i class="bi" [ngClass]="temaAtual === 'dark' ? 'bi-sun' : 'bi-moon-stars'"></i>
        <span>{{ temaAtual === 'dark' ? 'Tema claro' : 'Tema escuro' }}</span>
      </button>

      <a class="btn admin-sidebar-logout-btn w-100 fw-semibold" routerLink="/login">
        <i class="bi bi-box-arrow-right me-2"></i>
        Sair
      </a>
    </div>
  </div>
</aside>
