<button type="button" class="btn btn-primary d-lg-none position-fixed top-0 start-0 m-3 shadow z-3"
  data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menu">
  <i class="bi bi-list fs-4"></i>
</button>

<aside id="menuLateral" class="offcanvas-lg offcanvas-start text-bg-primary sidebar-bootstrap" tabindex="-1"
  aria-labelledby="menuLateralTitulo">
  <div class="offcanvas-header border-bottom border-light border-opacity-25">
    <div class="d-flex align-items-center gap-3">
      <div class="d-inline-flex align-items-center justify-content-center rounded-3 bg-warning text-primary p-2 fs-4">
        <i class="bi bi-building-check"></i>
      </div>

      <div>
        <h1 id="menuLateralTitulo" class="h5 fw-bold mb-0">NexusRH</h1>
        <small class="text-white-50 text-uppercase fw-semibold">Intranet corporativa</small>
      </div>
    </div>

    <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
      data-bs-target="#menuLateral" aria-label="Fechar menu"></button>
  </div>
<!-- -------------------------------------------------------------------- -->
 
<!-- -------------------------------------------------------------------- -->
  

  <div class="offcanvas-body d-flex flex-column p-3">
    <div class="card bg-white bg-opacity-10 border-light border-opacity-25 text-white mb-4">
      <div class="card-body d-flex align-items-center gap-3 p-3">
        <div
          class="rounded-circle bg-info text-white fw-bold d-inline-flex align-items-center justify-content-center sidebar-avatar">
          {{ usuario.iniciais }}
        </div>

        <div class="text-truncate">
          <strong class="d-block text-truncate">{{ usuario.nome }}</strong>
          <small class="d-block text-white-75 text-truncate">{{ usuario.cargo }}</small>
          <small class="d-block text-white-50 text-truncate">{{ usuario.setor }}</small>
        </div>
      </div>
    </div>

    <nav class="nav nav-pills flex-column gap-2" aria-label="Menu principal">
      <a *ngFor="let item of menu"
        class="nav-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-white fw-semibold"
        [routerLink]="item.rota" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.exata }"
        data-bs-dismiss="offcanvas" data-bs-target="#menuLateral">
        <i class="bi fs-5" [ngClass]="item.icone"></i>
        <span>{{ item.nome }}</span>
      </a>
    </nav>

    <div class="mt-auto pt-4">
      <div class="card bg-white bg-opacity-10 border-light border-opacity-25 text-white mb-3">
        <div class="card-body p-3">
          <small class="d-block text-white-50">Jornada padrão</small>
          <strong class="d-block">08:00 às 17:00</strong>
        </div>
      </div>

      <button type="button" class="btn btn-outline-light w-100 mb-2" (click)="alternarTema()">
        <i class="bi" [ngClass]="temaAtual === 'dark' ? 'bi-sun' : 'bi-moon-stars'"></i>
        {{ temaAtual === 'dark' ? 'Tema claro' : 'Tema escuro' }}
      </button>

      <a class="btn btn-light w-100 text-primary fw-semibold" routerLink="/login">
        <i class="bi bi-box-arrow-right me-2"></i>
        Sair
      </a>
    </div>
  </div>
</aside>
