<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-icon">
      <i class="bi bi-building-check"></i>
    </div>

    <div class="brand-text">
      <h1>NexusRH</h1>
      <span>Intranet corporativa</span>
    </div>
  </div>

  <div class="profile-card">
    <div class="avatar">{{ usuario.iniciais }}</div>

    <div class="profile-info">
      <strong>{{ usuario.nome }}</strong>
      <span>{{ usuario.cargo }}</span>
      <small>{{ usuario.setor }}</small>
    </div>
  </div>

  <nav class="sidebar-menu" aria-label="Menu principal">
    <a
      *ngFor="let item of menu"
      class="sidebar-link"
      [routerLink]="item.rota"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.exata }"
    >
      <i class="bi" [ngClass]="item.icone"></i>
      <span>{{ item.nome }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div>
      <strong>Jornada padrão</strong>
      <span>08:00 às 17:00</span>
    </div>

    <a class="logout-link" routerLink="/login">
      <i class="bi bi-box-arrow-right"></i>
      <span>Sair</span>
    </a>
  </div>
</aside>
