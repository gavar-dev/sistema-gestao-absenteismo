<header class="app-header border-bottom">
  <div class="container-fluid py-3">
    <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
      <div>
        <span class="text-primary text-uppercase fw-bold small">
          {{ subtitulo }}
        </span>

        <h1 class="h2 fw-bold mb-1">
          {{ titulo }}
        </h1>

        <p class="mb-0 text-secondary">
          {{ descricao }}
        </p>
      </div>

      <div class="header-date-card d-flex align-items-center gap-3">
        <div class="rounded-3 bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center p-3">
          <i class="bi bi-calendar2-week fs-4"></i>
        </div>

        <div>
          <strong class="d-block">Hoje</strong>
          <small class="text-body-secondary text-capitalize">{{ dataHoje }}</small>
        </div>
      </div>
    </div>
  </div>
</header>
