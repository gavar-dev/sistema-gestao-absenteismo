<div class="container-fluid py-4 py-lg-5">
  
  <div class="row g-4 mb-4">
    <div class="col-12 col-sm-6 col-xl-3" *ngFor="let item of resumo">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body d-flex gap-3">
          <div class="rounded-3 bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center ponto-icon">
            <i class="bi fs-4" [ngClass]="item.icone"></i>
          </div>

          <div>
            <small class="text-body-secondary fw-semibold">{{ item.titulo }}</small>
            <strong class="d-block fs-4 lh-1 mt-2">{{ item.valor }}</strong>
            <small class="text-body-tertiary d-block mt-2">{{ item.detalhe }}</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-xl-8">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header bg-body border-0 pt-4 px-4 d-flex flex-column flex-sm-row justify-content-between gap-2">
          <div>
            <h2 class="h4 fw-bold mb-1">Bater ponto</h2>
            <p class="text-body-secondary mb-0">Use os botões abaixo conforme sua jornada.</p>
          </div>
          <span class="badge text-bg-success align-self-start rounded-pill">Online</span>
        </div>

        <div class="card-body p-4">
          <div class="row g-3">
            <div class="col-12 col-md-6" *ngFor="let acao of acoesPonto">
              <button
                type="button"
                class="btn w-100 h-100 text-start p-3 border shadow-sm"
                [ngClass]="registrado(acao.nome) ? 'btn-success' : 'btn-light ponto-action-btn'"
                [disabled]="registrado(acao.nome)"
                (click)="registrarPonto(acao)"
              >
                <span class="d-inline-flex align-items-center justify-content-center rounded-3 p-2 mb-3"
                  [ngClass]="registrado(acao.nome) ? 'bg-white bg-opacity-25' : 'bg-primary-subtle text-primary'">
                  <i class="bi fs-4" [ngClass]="acao.icone"></i>
                </span>
                <strong class="d-block fs-5">{{ acao.nome }}</strong>
                <small class="d-block mt-1">
                  {{ registrado(acao.nome) ? 'Registro concluído' : acao.descricao }}
                </small>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-xl-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header bg-body border-0 pt-4 px-4 d-flex flex-column gap-3">
          <div>
            <h2 class="h4 fw-bold mb-1">Registros do dia</h2>
            <p class="text-body-secondary mb-0">Pontos batidos hoje.</p>
          </div>

          <a routerLink="/solicitacao" class="btn btn-outline-primary align-self-start">
            Solicitar correção
            <i class="bi bi-arrow-right ms-1"></i>
          </a>
        </div>

        <div class="card-body p-4">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">Tipo</th>
                  <th scope="col">Horário</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>

              <tbody>
                <tr *ngFor="let registro of registros">
                  <td>
                    <div class="d-flex align-items-center gap-2">
                      <span class="rounded-3 bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center registro-icon">
                        <i class="bi" [ngClass]="registro.icone"></i>
                      </span>
                      <strong>{{ registro.tipo }}</strong>
                    </div>
                  </td>
                  <td class="fw-bold">{{ registro.horario }}</td>
                  <td>
                    <span class="badge text-bg-success-subtle text-success-emphasis">
                      {{ registro.status }}
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="text-center text-body-secondary py-4" *ngIf="registros.length === 0">
            <i class="bi bi-clock-history fs-2 d-block mb-2"></i>
            Nenhum ponto registrado hoje.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
